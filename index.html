        }else{
          tap();session.quizIndex+=1;session.quizSelected=null;session.quizChecked=false;
          const quizOrder = session.quizOrder || lesson.words;
          if(session.quizIndex>=quizOrder.length && session.retryQueue.length && !session.retrying){
            session.retryCount += session.retryQueue.length; session.quizOrder = [...session.retryQueue]; session.retryQueue=[]; session.quizIndex=0; session.retrying=true;
            session.quizOptions=makeLessonOptions(lesson,session.quizOrder[session.quizIndex]); renderLesson();
          } else if(session.quizIndex>=quizOrder.length){
            if(lesson.grammar){session.stage='grammar_check';session.grammarSelected=null;session.grammarChecked=false;renderLesson();}
            else {session.stage='result';renderLessonResult();}
          }
          else{session.quizOptions=makeLessonOptions(lesson,quizOrder[session.quizIndex]);renderLesson();}
        }
      });
      const grammarOptions=screen.querySelectorAll('[data-grammar-option]');
      grammarOptions.forEach(button=>button.addEventListener('click',()=>{if(session.grammarChecked)return;tap();session.grammarSelected=Number(button.dataset.grammarOption);screen.querySelectorAll('[data-grammar-option]').forEach(item=>item.classList.toggle('selected',item===button));const action=document.getElementById('grammarCheckAction');if(action)action.disabled=false;}));
      const grammarCheckAction=document.getElementById('grammarCheckAction');
      if(grammarCheckAction)grammarCheckAction.addEventListener('click',()=>{
        if(!session.grammarChecked){
          if(session.grammarSelected===null)return;
          session.grammarChecked=true;
          const question=lesson.grammar.question;
          const correct=session.grammarSelected===question.correct;
          state.totalAnswered+=1;
          if(correct){session.correct+=1;state.totalCorrect+=1;if(!state.completedLessons.includes(lesson.id))addXp(5);}
          else session.incorrect+=1;
          recordExerciseTask(lesson.id,'grammar',lesson.grammar.tense,question.options[session.grammarSelected],correct);
          saveState();renderLesson();
        }else{tap();session.stage='result';renderLessonResult();}
      });
      const speakFlashcard=document.getElementById('speakFlashcard');
      if(speakFlashcard)speakFlashcard.addEventListener('click',()=>{tap();speakWord(lesson.words[session.cardIndex]);});
    }
    function makeLessonOptions(lesson, wordId) {
      const allowed = new Set(learnedWordIdsForLesson(lesson));
      const correct=wordCatalog[wordId];
      const candidates=[...allowed].map(id=>wordCatalog[id]).filter(item=>item && item.id!==wordId && item.ru!==correct.ru);
      for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}
      const items=[correct,...candidates.slice(0,2)];
      for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
      return {items,correctIndex:items.findIndex(item=>item.id===wordId)};
    }
    function bindSpeechButtons(root) {
      if(!root)return;
      root.querySelectorAll('[data-speak]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();tap();speakWord(button.dataset.speak);}));
    }
    function bindWordTips(root) {
      if(!root)return;
      root.querySelectorAll('[data-word-tip]:not([data-token-idx])').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();showWordPopover(button.dataset.wordTip,button);}));
    }
    function speakWord(wordId) {
      const entry=wordCatalog[wordId];
      if(!entry)return;
      if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){showToast('Озвучка не поддерживается этим браузером');return;}
      try{
        window.speechSynthesis.cancel();
        const utterance=new SpeechSynthesisUtterance(entry.en);
        utterance.lang='en-GB';utterance.rate=.88;utterance.pitch=1.02;
        window.speechSynthesis.speak(utterance);
      }catch(_){showToast('Не удалось запустить озвучку');}
    }
    function showWordPopover(wordId, anchor) {
      const entry=wordCatalog[wordId];const pop=document.getElementById('wordPopover');
      if(!entry||!pop||!anchor)return;
      pop.innerHTML=`<div class="word-popover-copy"><strong>${escapeHtml(entry.en)}</strong><span>${escapeHtml(entry.ru)}</span></div><button class="popover-speak" data-speak="${entry.id}" aria-label="Озвучить слово">🔊</button>`;
      pop.hidden=false;
      const rect=anchor.getBoundingClientRect();
      const appRect=document.getElementById('app').getBoundingClientRect();
      const width=Math.min(250,appRect.width-24);
      pop.style.width=`${width}px`;
      pop.style.left='12px';pop.style.top='8px';
      const popRect=pop.getBoundingClientRect();
      const left=Math.max(12,Math.min(appRect.width-popRect.width-12,rect.left-appRect.left+rect.width/2-popRect.width/2));
      let top=rect.top-appRect.top-popRect.height-9;
      if(top<8)top=rect.bottom-appRect.top+9;
      if(top+popRect.height>appRect.height-8)top=Math.max(8,appRect.height-popRect.height-8);
      pop.style.left=`${left}px`;pop.style.top=`${top}px`;
      bindSpeechButtons(pop);
    }
    document.addEventListener('click',event=>{
      const pop=document.getElementById('wordPopover');
      if(!pop||pop.hidden)return;
      if(event.target.closest('#wordPopover,[data-word-tip],[data-token-idx]'))return;
      pop.hidden=true;
    });
    window.addEventListener('resize',()=>{const pop=document.getElementById('wordPopover');if(pop)pop.hidden=true;});
    document.getElementById('screen').addEventListener('scroll',()=>{const pop=document.getElementById('wordPopover');if(pop)pop.hidden=true;},{passive:true});

    function openExitModal(context) {
      const overlay = document.getElementById('exitModal');
      if (!overlay) return;
      if (exitModalTimer) { clearTimeout(exitModalTimer); exitModalTimer = null; }
      exitModalContext = context;
      exitReturnFocus = document.activeElement;
      overlay.innerHTML = `<section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="exitDialogTitle" aria-describedby="exitDialogText" tabindex="-1">
        <div class="exit-mascot">${lumiArt('is-sad')}</div>
        <div class="eyebrow">ПАУЗА В ПОЛЁТЕ</div>
        <h2 id="exitDialogTitle">Точно хочешь прервать полёт?</h2>
        <p id="exitDialogText">Прогресс этого урока не сохранится!</p>
        <div class="exit-dialog-actions">
          <button class="btn full exit-stay" id="stayInLesson">Остаться в уроке</button>
          <button class="btn full exit-leave" id="leaveForMap">Выйти на карту</button>
        </div>
      </section>`;
      overlay.hidden = false;
      overlay.setAttribute('aria-hidden', 'false');
      const stayButton = overlay.querySelector('#stayInLesson');
      const leaveButton = overlay.querySelector('#leaveForMap');
      stayButton.addEventListener('click', () => { tap(); closeExitModal(true); });
      leaveButton.addEventListener('click', () => {
        tap();
        const contextToExit = exitModalContext;
        closeExitModal(false);
        lessonSession = null;
        if (contextToExit === 'warmup') {
          // Skipping the optional first warm-up should still lead to the planet map.
          state.warmupDone = true;
          state.onboardingDone = true;
          saveState();
        }
        reviewSession = null;
        currentTab = 'map';
        render();
        showToast('Ты вернулся на карту планет 🪐');
      });
      requestAnimationFrame(() => {
        overlay.classList.add('show');
        stayButton.focus({ preventScroll: true });
      });
    }

    function closeExitModal(restoreFocus = true) {
      const overlay = document.getElementById('exitModal');
      if (!overlay || overlay.hidden) return;
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      exitModalContext = null;
      if (exitModalTimer) clearTimeout(exitModalTimer);
      exitModalTimer = window.setTimeout(() => {
        overlay.hidden = true;
        overlay.innerHTML = '';
        if (restoreFocus && exitReturnFocus && exitReturnFocus.isConnected) exitReturnFocus.focus({ preventScroll: true });
        exitReturnFocus = null;
        exitModalTimer = null;
      }, 210);
    }

    document.addEventListener('keydown', event => {
      const overlay = document.getElementById('exitModal');
      if (event.key === 'Escape' && overlay && !overlay.hidden) {
        event.preventDefault();
        closeExitModal(true);
      }
    });

    function renderLessonResult() {
      const session=lessonSession;
      const screen=document.getElementById('screen');
      screen.scrollTop=0;
      const lesson=session.lesson;
      const wasCompleted=state.completedLessons.includes(lesson.id);
      const reward=wasCompleted?0:10;
      const xpRewardBase = wasCompleted ? 0 : 20;
      const xpReward = xpRewardBase * (isProEnabled() ? 2 : 1);
      let dailyGoalReached = false;
      let dailyBonusXp = 0;
      if(!session.rewarded){
        if(!wasCompleted){
          state.completedLessons.push(lesson.id);
          state.lessonsCompleted+=1;
          lesson.words.forEach(id=>{
            if(!state.learnedWords.includes(id))state.learnedWords.push(id);
            state.wordMastery[id]=Math.max(1,Number(state.wordMastery[id])||0);
          });
          const planet=allPlanets.find(item=>item.id===lesson.planetId);
          if(planet && planet.lessons.every(item=>state.completedLessons.includes(item.id)) && !state.completedPlanets.includes(planet.id))state.completedPlanets.push(planet.id);
          addCrystals(reward);addXp(xpRewardBase);state.dailyMinutes=Math.min(state.goal,state.dailyMinutes+2);
        }else{
          lesson.words.forEach(id=>{state.wordMastery[id]=Math.min(5,masteryValue(id)+(session.correct>0?1:0));});
        }
        registerActiveDay(localDateKey());
        if (!wasCompleted) {
          const dailyReward = recordDailyLessonCompletion(lesson.id);
          dailyGoalReached = dailyReward.reached;
          dailyBonusXp = dailyReward.bonusXp;
        }
        state.vocabLearned=state.learnedWords.length;
        state.lessonHistory.push({lessonId:lesson.id,date:localDateKey(),correct:session.correct,total:lesson.words.length+1+(session.retryCount||0)+(lesson.grammar?1:0),xp:xpReward,crystals:reward});
        state.lessonHistory = state.lessonHistory.slice(-100);
        const newlyUnlocked = checkAchievements();
        session.rewarded=true;saveState();
        if (newlyUnlocked.length) showToast(`Новое достижение: ${newlyUnlocked[0].name} 🏆`);
      }
      const totalQuestions=lesson.words.length+1+(session.retryCount||0)+(lesson.grammar?1:0);
      const perfect=session.correct>=totalQuestions;
      document.getElementById('screen').innerHTML=`<div class="page"><div class="card lesson-result">
        ${lumiArt('is-happy')}<div class="eyebrow">МИССИЯ ${wasCompleted?'ПОВТОРЕНА':'ЗАВЕРШЕНА'}</div><h1>${wasCompleted?'Отличное повторение!':'Ты справился! 🌟'}</h1><p class="muted small">${escapeHtml(lesson.title)} завершён. ${wasCompleted?'Твои слова стали ещё крепче в памяти.':'Все новые слова отправлены в учебник. Луми гордится тобой!'}</p>
        ${wasCompleted?'<div class="result-reward">🧠 Запоминание обновлено</div>':`<div class="result-reward">💎 +${reward} кристаллов · ⚡ +${xpReward} XP за миссию</div>`}
        ${dailyGoalReached ? `<div class="result-reward" style="background:#e9faf3;color:#087d58">🎯 Дневная цель выполнена · +15 💎 · +${dailyBonusXp} XP</div>` : `<p class="small muted">Дневной план: ${dailyLessonProgress()}/${dailyLessonTarget()} миссий. За выполнение цели — +15 💎 и бонус XP.</p>`}
        <div class="stats-grid" style="text-align:left"><div class="card metric"><div class="metric-icon">✅</div><strong>${session.correct}/${totalQuestions}</strong><span>ВЕРНЫХ ЗАДАНИЙ</span></div><div class="card metric"><div class="metric-icon">📚</div><strong>${state.learnedWords.length}</strong><span>СЛОВ В УЧЕБНИКЕ</span></div></div><p class="small muted" style="text-align:center">Результаты всех упражнений сохранены в журнале учебника.</p>
        <button class="btn green full" id="backToMap">Вернуться на карту 🪐</button>
        <button class="btn secondary full" id="openTextbook" style="margin-top:10px">Открыть учебник 📚</button>
      </div></div>`;
      const mascot=document.querySelector('#screen .lumi-wrap');if(mascot){mascot.classList.add('is-happy');sound('success');haptic('success');}
      document.getElementById('backToMap').addEventListener('click',()=>{tap();lessonSession=null;currentTab='map';render();});
      document.getElementById('openTextbook').addEventListener('click',()=>{tap();lessonSession=null;currentTab='book';render();});
    }

    document.getElementById('bottomNav').addEventListener('click', event => {
      const button = event.target.closest('[data-tab]');
      if (!button || lessonSession || dialogSession) return;
      tap(); currentTab = button.dataset.tab; render();
    });

    // Сначала загружаем облачный снимок, и только потом показываем игру:
    // так локальные данные не успеют перезаписать более свежий прогресс Telegram.
    async function bootstrapLumiApp() {
      await initializeProgressStorage();
      // Ensure the welcome flow remains first for fresh installs, and recover cleanly after reloads.
      if (state.today !== localDateKey()) {
        // Streak is only advanced when the learner actually completes an activity today.
      }
      ensureLeagueWeek();
      const startupAchievements = checkAchievements();
      if (startupAchievements.length) saveState();
      await verifyProOnStartup();
      render();
      window.setInterval(() => {
        const changed = refreshEnergy();
        if (changed) {
          updateTopStats();
          if (currentTab === 'map' && !lessonSession && state.onboardingDone) render();
        }
      }, 60 * 1000);
      window.setInterval(() => { verifyProOnStartup(); }, 5 * 60 * 1000);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushCloudProgressSave();
    });
    window.addEventListener('pagehide', flushCloudProgressSave);
    bootstrapLumiApp().catch(error => {
      console.error('Lumi startup failed:', error);
      cloudStorageReady = false;
      cloudStorageStatus = 'local';
      progressStorageReady = true;
      render();
      showToast('Запущен локальный режим сохранения');
    });
  </script>
</body>
</html>
