<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="description" content="Космическая Академия Языков — изучай английский вместе с Луми.">
  <title>Lumi — Космическая Академия Языков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --ink: #20263a;
      --muted: #8490a7;
      --cyan: #06b6d4;
      --cyan-dark: #0891b2;
      --pink: #ff4d8d;
      --green: #10b981;
      --purple: #8b5cf6;
      --gold: #f59e0b;
      --card: #ffffff;
      --line: #e9edf5;
      --shadow: 0 9px 24px rgba(44, 61, 100, .09), 0 2px 5px rgba(44, 61, 100, .04);
      --soft-shadow: 0 5px 0 rgba(8, 145, 178, .2), 0 8px 16px rgba(8, 145, 178, .12);
      --radius: 22px;
    }
    :root[data-theme="ocean"] { --bg:#edf7fa; --ink:#183445; --muted:#718d9c; --cyan:#159fbd; --cyan-dark:#087d9b; --pink:#e8799d; --green:#0f9f83; --purple:#647bd8; --gold:#d69a32; --card:#ffffff; --line:#dcecf1; --shadow:0 9px 24px rgba(20,75,95,.09),0 2px 5px rgba(20,75,95,.04); }
    :root[data-theme="lavender"] { --bg:#f5f2fb; --ink:#302b48; --muted:#9189a9; --cyan:#7b8ee8; --cyan-dark:#596bc7; --pink:#e98db5; --green:#56ad91; --purple:#9672d6; --gold:#d6a34e; --card:#fff; --line:#e9e2f4; }
    :root[data-theme="sunset"] { --bg:#fff5ef; --ink:#49303a; --muted:#a18b91; --cyan:#ed8a70; --cyan-dark:#c96a56; --pink:#ed7197; --green:#83ae78; --purple:#a17acb; --gold:#e2a43b; --card:#fffdfb; --line:#f3e2da; }
    :root[data-theme="forest"] { --bg:#f0f6f0; --ink:#263c32; --muted:#82968a; --cyan:#55a98c; --cyan-dark:#347c64; --pink:#d77e91; --green:#459b6e; --purple:#8b80bc; --gold:#c49b45; --card:#fff; --line:#dce9df; }
    :root[data-theme="midnight"] { --bg:#20283b; --ink:#eef2ff; --muted:#aab6ce; --cyan:#54c5dc; --cyan-dark:#279ab5; --pink:#ff83ae; --green:#50d0a0; --purple:#b29aff; --gold:#ffd071; --card:#2b354c; --line:#3b4862; --shadow:0 9px 24px rgba(0,0,0,.18); }
    :root[data-theme="rose"] { --bg:#fff2f6; --ink:#482b3a; --muted:#a68b9a; --cyan:#d879aa; --cyan-dark:#b85d8e; --pink:#f17ca6; --green:#63aa91; --purple:#a17bd1; --gold:#d5a34c; --card:#fff; --line:#f0dfe8; }
    :root[data-theme="galaxy"] { --bg:#f1effb; --ink:#302b50; --muted:#8983a8; --cyan:#6f8fe4; --cyan-dark:#526bc0; --pink:#e77fae; --green:#55ad9a; --purple:#9474df; --gold:#d9a74d; --card:#fff; --line:#e3def3; }
    :root[data-theme="midnight"] .topbar { background:rgba(32,40,59,.9); }
    :root[data-theme="midnight"] .bottom-nav { background:rgba(43,53,76,.97); border-color:var(--line); }
    :root[data-theme="midnight"] .stat-pill, :root[data-theme="midnight"] .skin-choice { background:#35415b; color:var(--ink); border-color:var(--line); }
    :root[data-theme="midnight"] .nav-btn.active { background:#344b62; }
    .economy-section,.theme-section,.achievement-section,.history-section { padding:14px; margin-top:13px; }
    .shop-grid,.theme-grid,.achievement-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:11px; }
    .shop-item,.theme-choice,.achievement-item { min-width:0; padding:11px 9px; border:1px solid var(--line); border-radius:15px; background:var(--card); color:var(--ink); text-align:center; }
    .shop-item .shop-icon,.theme-choice .theme-icon { display:block; font-size:25px; margin-bottom:5px; }
    .shop-item strong,.theme-choice strong,.achievement-item strong { display:block; font-size:11px; line-height:1.3; }
    .shop-item small,.theme-choice small,.achievement-item small { display:block; margin-top:4px; color:var(--muted); font-size:10px; line-height:1.35; }
    .shop-item button,.theme-choice button { width:100%; min-height:36px; margin-top:8px; border:0; border-radius:10px; background:var(--cyan); color:#fff; font-size:10px; font-weight:900; cursor:pointer; }
    .shop-item button:disabled,.theme-choice button:disabled { opacity:.55; cursor:not-allowed; }
    .theme-choice.selected { border:2px solid var(--cyan); background:color-mix(in srgb,var(--cyan) 8%,var(--card)); }
    .theme-swatch { display:flex; justify-content:center; gap:4px; margin:2px auto 8px; }
    .theme-swatch i { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.8); }
    .achievement-item.unlocked { border-color:#f0c76b; background:linear-gradient(145deg,var(--card),rgba(245,158,11,.08)); }
    .achievement-item .achievement-icon { display:block; font-size:23px; margin-bottom:5px; }
    .history-row { display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:11px; }
    .history-row:last-child { border-bottom:0; }
    .history-row span:last-child { color:var(--muted); white-space:nowrap; }
    .economy-note { margin-top:8px; color:var(--muted); font-size:10px; line-height:1.45; }
    @media (max-width:380px) { .shop-grid,.theme-grid,.achievement-grid { grid-template-columns:1fr 1fr; } }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex; justify-content: center; align-items: stretch;
      color: var(--ink); background: var(--bg);
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; min-height: 44px; }
    .app-frame {
      position: relative; display: flex; flex-direction: column;
      width: 100%; max-width: 480px; height: 100dvh; min-height: 0;
      overflow: hidden; background-color: var(--bg);
      background-image: radial-gradient(rgba(6,182,212,.11) 1px, transparent 1px), radial-gradient(rgba(139,92,246,.08) 1px, transparent 1px);
      background-size: 26px 26px, 39px 39px; background-position: 0 0, 13px 17px;
    }
    @media (min-width: 600px) {
      body { align-items: center; padding: 18px; }
      .app-frame { height: min(920px, calc(100dvh - 36px)); min-height: 0; border: 1px solid rgba(220,226,239,.9); border-radius: 30px; box-shadow: 0 25px 80px rgba(36,49,83,.17); }
    }
    .topbar {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 18px 10px; min-height: 66px;
      background: rgba(244,246,251,.88); backdrop-filter: blur(14px); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-mark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg,#c9f8fb,#e8ddff); box-shadow: inset 0 -3px 0 rgba(6,182,212,.14); font-size: 20px; }
    .brand-copy { min-width: 0; }
    .brand-name { font-size: 14px; line-height: 1.1; font-weight: 900; letter-spacing: -.3px; white-space: nowrap; }
    .brand-sub { color: var(--muted); font-size: 10px; font-weight: 700; margin-top: 3px; }
    .top-stats { display: flex; align-items: center; gap: 7px; }
    .stat-pill { min-height: 34px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 12px; background: #fff; box-shadow: 0 2px 7px rgba(35,50,80,.06); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .stat-pill .stat-icon { font-size: 15px; }
    .scroll-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #d5ddeb transparent; padding: 5px 17px max(34px, calc(26px + env(safe-area-inset-bottom))); }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: #d5ddeb; border-radius: 9px; }
    .bottom-nav[hidden] { display: none; }
    .bottom-nav {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(4,1fr); gap: 3px;
      padding: 8px 9px calc(8px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96);
      border-top: 1px solid rgba(226,232,242,.9); box-shadow: 0 -7px 22px rgba(42,57,91,.05); z-index: 6;
    }
    .nav-btn { border: 0; min-width: 0; min-height: 54px; padding: 5px 2px 3px; background: transparent; border-radius: 14px; color: #99a3b6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-size: 10px; font-weight: 800; transition: background .2s, color .2s, transform .15s; }
    .nav-btn .nav-icon { font-size: 20px; line-height: 1.1; }
    .nav-btn.active { color: var(--cyan-dark); background: #e8fbfe; }
    .nav-btn:active { transform: scale(.95); }
    .nav-btn.pro.active { color: var(--purple); background: #f2edff; }
    .page { animation: pageIn .28s ease both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { color: var(--cyan-dark); text-transform: uppercase; letter-spacing: 1.25px; font-size: 10px; font-weight: 900; }
    h1,h2,h3,p { margin-top: 0; }
    h1 { font-size: 25px; line-height: 1.13; letter-spacing: -.8px; margin-bottom: 8px; }
    h2 { font-size: 19px; letter-spacing: -.45px; margin-bottom: 7px; }
    h3 { font-size: 15px; margin-bottom: 6px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; line-height: 1.5; }
    .card { background: var(--card); border: 1px solid rgba(231,236,246,.9); border-radius: var(--radius); box-shadow: var(--shadow); }
    .btn {
      border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 0 18px; border-radius: 15px; cursor: pointer; font-weight: 900;
      color: #fff; background: var(--cyan); box-shadow: 0 5px 0 var(--cyan-dark), 0 8px 15px rgba(6,182,212,.15);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cyan-dark), 0 3px 8px rgba(6,182,212,.12); }
    .btn:disabled { cursor: not-allowed; filter: grayscale(.35); opacity: .58; transform: none; }
    .btn.secondary { color: #44506a; background: #edf1f8; box-shadow: 0 4px 0 #dce3ef; }
    .btn.pink { background: var(--pink); box-shadow: 0 5px 0 #dd3372, 0 8px 15px rgba(255,77,141,.14); }
    .btn.green { background: var(--green); box-shadow: 0 5px 0 #0b9266, 0 8px 15px rgba(16,185,129,.15); }
    .btn.purple { background: var(--purple); box-shadow: 0 5px 0 #7042d2, 0 8px 15px rgba(139,92,246,.17); }
    .btn.full { width: 100%; }
    .icon-btn { border: 0; background: #fff; min-width: 44px; min-height: 44px; border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; font-size: 18px; }
    .hero { display: grid; grid-template-columns: 1fr 144px; align-items: center; gap: 2px; padding: 13px 14px 10px; overflow: hidden; background: linear-gradient(125deg,#fff 5%,#f0fcff 60%,#f6efff); }
    .hero-copy { min-width: 0; padding: 5px 0 7px 3px; }
    .hero-copy h1 { font-size: 23px; margin: 7px 0; }
    .hero-copy p { margin: 0; max-width: 225px; font-size: 12px; line-height: 1.45; color: #78859c; }
    .hero-mascot { display: grid; place-items: center; min-width: 0; }
    .lumi-wrap { position: relative; width: 100%; max-width: 166px; aspect-ratio: 1 / 1; display: grid; place-items: center; isolation: isolate; }
    .lumi-svg { width: 100%; height: 100%; overflow: visible; animation: floaty 3.7s ease-in-out infinite; transform-origin: 50% 58%; filter: drop-shadow(0 9px 8px rgba(91,111,158,.13)); }
    @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    .gill { transform-box: fill-box; transform-origin: center; animation: gillWiggle 2.4s ease-in-out infinite; }
    .gill:nth-of-type(2n) { animation-delay: .25s; }
    @keyframes gillWiggle { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(4deg) scale(1.04); } }
    .eye-normal { animation: blink 5.4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,45%,48%,100% { transform: scaleY(1); } 46.5% { transform: scaleY(.08); } }
    .eye-star { opacity: 0; transform: scale(.4); transform-origin: center; transition: .18s; }
    .lumi-wrap.is-happy .eye-normal { opacity: 0; }
    .lumi-wrap.is-happy .eye-star { opacity: 1; transform: scale(1); }
    .lumi-wrap.is-happy .lumi-svg { animation: happyHop .65s ease-in-out 2; }
    @keyframes happyHop { 0%,100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-20px) rotate(-4deg) scale(1.04); } 70% { transform: translateY(1px) rotate(4deg); } }
    .lumi-wrap.is-sad .lumi-svg { animation: shy .6s ease-in-out 2; }
    .lumi-wrap.is-sad .gill-shape { fill: #ffad72 !important; filter: drop-shadow(0 0 5px #ffad72); }
    @keyframes shy { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(2px); } 75% { transform: rotate(6deg) translateY(2px); } }
    .paw-cover { opacity: 0; transition: opacity .2s; }
    .lumi-wrap.is-sad .paw-cover { opacity: 1; }
    .sparkle { position: absolute; z-index: 2; color: #f6b83f; font-size: 17px; pointer-events: none; opacity: 0; }
    .is-happy .sparkle { animation: sparklePop .85s ease-out both; }
    .sparkle.s1 { top: 10%; left: 12%; } .sparkle.s2 { top: 24%; right: 4%; animation-delay: .12s !important; } .sparkle.s3 { bottom: 12%; left: 18%; animation-delay: .22s !important; }
    @keyframes sparklePop { 0% { opacity: 0; transform: scale(.2) rotate(0); } 35% { opacity: 1; transform: scale(1.3) rotate(35deg); } 100% { opacity: 0; transform: scale(.5) translateY(-20px) rotate(80deg); } }
    .bubble { position: absolute; width: 9px; height: 9px; border: 2px solid #7dd9e9; border-radius: 50%; opacity: 0; bottom: 18%; right: 15%; }
    .is-sad .bubble { animation: bubbleUp 1.25s ease-out infinite; }
    .is-sad .bubble.b2 { right: 5%; bottom: 30%; animation-delay: .3s; width: 6px; height: 6px; }
    @keyframes bubbleUp { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(10px,-38px) scale(1.5); } }
    .daily-card { margin-top: 13px; padding: 14px; }
    .section-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .section-row h2 { margin: 0; }
    .tiny-link { color: var(--cyan-dark); font-size: 11px; font-weight: 900; border: 0; background: transparent; cursor: pointer; min-height: 44px; padding: 0 3px; }
    .goal-track { height: 10px; overflow: hidden; background: #edf1f7; border-radius: 99px; margin: 10px 0 7px; }
    .goal-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#06b6d4,#48d7c2); transition: width .5s; }
    .progress-line { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; font-weight: 700; }
    .planet-list { display: flex; flex-direction: column; gap: 11px; padding: 3px 0 18px; }
    .planet-card { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 11px; padding: 12px; min-height: 88px; cursor: pointer; transition: transform .15s; }
    .planet-card:active { transform: scale(.985); }
    .planet-art { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 19px; font-size: 29px; position: relative; overflow: hidden; }
    .planet-art:after { content: ""; position: absolute; width: 42px; height: 8px; border: 2px solid rgba(255,255,255,.65); border-radius: 50%; transform: rotate(-23deg); }
    .planet-card h3 { margin: 0 0 4px; }
    .planet-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .planet-meta { text-align: right; color: var(--muted); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .planet-meta strong { display: block; color: var(--ink); font-size: 12px; margin-bottom: 4px; }
    .locked { opacity: .72; }
    .progress-mini { width: 60px; height: 5px; background: #eef1f6; border-radius: 8px; margin-top: 7px; overflow: hidden; }
    .progress-mini span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
    .welcome { padding: 8px 0 26px; text-align: center; animation: pageIn .45s ease both; }
    .welcome .lumi-wrap { width: 220px; max-width: 62vw; margin: 4px auto 5px; }
    .welcome h1 { font-size: 28px; margin: 7px auto; max-width: 330px; }
    .welcome p { font-size: 13px; color: var(--muted); line-height: 1.55; max-width: 330px; margin: 0 auto 18px; }
    .goal-picks { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin: 15px 0 18px; }
    .goal-pick { min-height: 78px; border: 2px solid #edf0f6; border-radius: 17px; background: #fff; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; transition: .18s; }
    .goal-pick strong { font-size: 20px; }
    .goal-pick span { color: var(--muted); font-size: 10px; font-weight: 800; }
    .goal-pick small { color: var(--cyan-dark); font-size: 9px; font-weight: 900; line-height: 1.2; }
    .goal-pick.selected { border-color: var(--cyan); background: #edfcff; box-shadow: 0 0 0 3px rgba(6,182,212,.1); }
    .welcome .btn { max-width: 340px; width: 100%; }
    .warmup-card { padding: 18px; text-align: left; margin-top: 16px; }
    .warmup-top { display: flex; gap: 12px; align-items: center; }
    .warmup-top .lumi-wrap { width: 96px; flex: 0 0 96px; }
    .warmup-question { margin: 18px 0 14px; font-size: 20px; line-height: 1.3; font-weight: 900; letter-spacing: -.4px; }
    .answer-list { display: grid; gap: 9px; }
    .answer-option { display: flex; align-items: center; text-align: left; width: 100%; min-height: 50px; border: 2px solid #edf0f6; border-radius: 15px; background: #fff; padding: 9px 13px; color: var(--ink); font-size: 14px; font-weight: 800; cursor: pointer; transition: .16s; }
    .answer-option:active { transform: scale(.985); }
    .answer-option.selected { border-color: var(--cyan); background: #effcff; }
    .answer-option.correct { border-color: var(--green); background: #eafaf4; color: #087d58; }
    .answer-option.wrong { border-color: var(--pink); background: #fff0f5; color: #c12d65; }
    .feedback { margin-top: 13px; padding: 12px; border-radius: 14px; display: none; font-size: 12px; line-height: 1.45; }
    .feedback.show { display: block; animation: pageIn .2s ease; }
    .feedback.good { background: #e9faf3; color: #087d58; }
    .feedback.bad { background: #fff3ec; color: #a85b24; }
    .page-head { padding: 13px 2px 15px; }
    .page-head p { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.5; }
    .search-box { display: flex; align-items: center; gap: 8px; padding: 0 13px; min-height: 48px; background: #fff; border-radius: 15px; box-shadow: var(--shadow); margin: 5px 0 13px; }
    .search-box input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; }
    .word-list { display: grid; gap: 9px; }
    .word-card { padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .word-en { font-size: 15px; font-weight: 900; }
    .word-ru { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .word-tag { font-size: 9px; font-weight: 900; color: #7c55d7; background: #f2edff; padding: 5px 8px; border-radius: 9px; white-space: nowrap; }
    .rule-card { padding: 15px; margin-top: 14px; background: linear-gradient(135deg,#fff,#f6f2ff); }
    .rule-example { padding: 10px 12px; border-radius: 12px; background: #fff; margin-top: 10px; font-size: 12px; }
    .profile-hero { padding: 17px; display: flex; align-items: center; gap: 13px; background: linear-gradient(125deg,#fff,#f2fbff); }
    .avatar-orb { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 21px; display: grid; place-items: center; font-size: 34px; background: linear-gradient(145deg,#c9f8fb,#eadbff); }
    .profile-hero h2 { margin: 0 0 4px; }
    .profile-hero p { font-size: 11px; color: var(--muted); margin: 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 13px 0; }
    .metric { padding: 14px; min-height: 91px; }
    .metric-icon { font-size: 20px; }
    .metric strong { display: block; font-size: 23px; margin: 5px 0 1px; }
    .metric span { font-size: 10px; color: var(--muted); font-weight: 800; }
    .streak-card { padding: 15px; margin-bottom: 13px; }
    .streak-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; margin-top: 13px; }
    .streak-day { text-align: center; color: var(--muted); font-size: 9px; font-weight: 800; }
    .streak-day i { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 10px; background: #f0f3f8; margin: 0 auto 5px; font-style: normal; font-size: 13px; }

    <div class="exit-modal" id="exitModal" hidden aria-hidden="true"></div>
  </main>

  <script>
    'use strict';

    // Вставь сюда адрес опубликованного Cloudflare Worker.
    // Токен бота никогда не помещай в index.html — только в Worker Secret BOT_TOKEN.
    const WORKER_URL = "https://ВАШ-ВОРКЕР.workers.dev";

    // Telegram Mini App integration. The same file also works in an ordinary browser.
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try { tg.ready(); tg.expand(); tg.setHeaderColor('#f4f6fb'); tg.setBackgroundColor('#f4f6fb'); } catch (_) { /* Browser/older client fallback */ }
    }

    const STORAGE_KEY = 'lumi-cosmic-academy-v1';
    // ДЕМО-PRO виден только при локальном тестировании. На публичном сайте его нельзя включить простым кликом.
    const DEMO_PRO_ALLOWED = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '[::1]';
    const ENERGY_MAX = 5;
    const ENERGY_REGEN_MS = 30 * 60 * 1000; // одно сердечко каждые 30 минут
    const defaultState = {
      goal: 10, goalChosen: false, crystals: 0, xp: 0, streak: 0, lessonsCompleted: 0,
      totalCorrect: 0, totalAnswered: 0, dailyMinutes: 0, dailyCompletedLessons: [], dailyGoalClaimedDate: '', vocabLearned: 0,
      energy: ENERGY_MAX, energyUpdatedAt: Date.now(), proActive: false, demoPro: false,
      selectedSkin: 'default', ownedSkins: ['default'], selectedTheme: 'aurora', ownedThemes: ['aurora','ocean','lavender'], errorWords: [],
      lessonHistory: [], exerciseHistory: [], claimedAchievements: [], levelRewardsClaimed: [],
      streakLastDate: '', freeFreezeUsed: false, cryoFreezeDates: [],
      leaguePoints: 0, leagueWeekKey: '',
      dialogRecords: {}, dialogDailyRewardDate: '', dialogDailyRewards: [],
      onboardingDone: false, warmupDone: false, onboardingStep: '', completedPlanets: [], completedLessons: [], learnedWords: [], wordMastery: {},
      today: localDateKey(), dailyDate: localDateKey(), activeDays: []
    };
    let stateUpdatedAt = 0;
    let cloudStorageReady = false;
    let cloudStorageStatus = 'checking';
    let progressStorageReady = false;
    let cloudWriteTimer = null;
    let cloudWriteQueue = Promise.resolve();
    const CLOUD_STORAGE_KEY = 'lumi_progress_v1';
    let state = loadState();
    let proAccount = { startedAt: 0, expiresAt: 0, months: 0, wasPro: false, autoRenew: true, billingState: 'ok' };
    let dialogSession = null;
    let dialogTimer = null;
    let currentTab = 'map';
    let selectedGoal = state.goal || 10;
    let lessonSession = null;
    let reviewSession = null;
    let selectedBookFilter = 'Все';
    let bookQuery = '';
    let toastTimer = null;
    let audioContext = null;
    let exitModalContext = null;
    let exitReturnFocus = null;
    let exitModalTimer = null;

    function localDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
    function normalizeState(saved) {
      const freshState = () => ({ ...defaultState, completedPlanets:[], completedLessons:[], learnedWords:[], wordMastery:{}, activeDays:[], errorWords:[] });
      if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return freshState();
      const safeList = value => Array.isArray(value)
        ? [...new Set(value.filter(item => typeof item === 'string' && /^[a-z0-9_-]{1,40}$/i.test(item)))].slice(0,1000)
        : [];
      const safeInteger = (value, fallback, min = 0, max = 1000000000) => {
        const number = Number(value);
        return Number.isFinite(number) ? Math.min(max, Math.max(min, Math.floor(number))) : fallback;
      };
      try {
        const merged = { ...defaultState, ...saved };
        merged.completedPlanets = safeList(merged.completedPlanets);
        merged.completedLessons = safeList(merged.completedLessons);
        merged.learnedWords = safeList(merged.learnedWords);
        merged.errorWords = safeList(merged.errorWords);
        merged.activeDays = Array.isArray(merged.activeDays)
          ? [...new Set(merged.activeDays.filter(day => typeof day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(day)))].slice(-30)
          : [];
        merged.streakLastDate = typeof merged.streakLastDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(merged.streakLastDate) ? merged.streakLastDate : (merged.activeDays.slice(-1)[0] || '');
        merged.freeFreezeUsed = merged.freeFreezeUsed === true;
        merged.cryoFreezeDates = Array.isArray(merged.cryoFreezeDates) ? [...new Set(merged.cryoFreezeDates.filter(day => typeof day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(day)))].slice(-90) : [];
        merged.leaguePoints = safeInteger(merged.leaguePoints,0,0,1000000000);
        merged.leagueWeekKey = typeof merged.leagueWeekKey === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(merged.leagueWeekKey) ? merged.leagueWeekKey : '';
        const rawDialogRecords = merged.dialogRecords && typeof merged.dialogRecords === 'object' && !Array.isArray(merged.dialogRecords) ? merged.dialogRecords : {};
        merged.dialogRecords = {};
        for (const id of ['coffee','gaming','airport']) {
          const row = rawDialogRecords[id] && typeof rawDialogRecords[id] === 'object' ? rawDialogRecords[id] : {};
          merged.dialogRecords[id] = { bestTime:safeInteger(row.bestTime,0,0,86400), bestCorrect:safeInteger(row.bestCorrect,0,0,20), runs:safeInteger(row.runs,0,0,1000000) };
        }
        merged.dialogDailyRewardDate = typeof merged.dialogDailyRewardDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(merged.dialogDailyRewardDate) ? merged.dialogDailyRewardDate : '';
        merged.dialogDailyRewards = safeList(merged.dialogDailyRewards).filter(id => ['coffee','gaming','airport'].includes(id)).slice(0,3);
        if (merged.dialogDailyRewardDate !== localDateKey()) { merged.dialogDailyRewardDate = localDateKey(); merged.dialogDailyRewards = []; }
        const rawMastery = merged.wordMastery && typeof merged.wordMastery === 'object' && !Array.isArray(merged.wordMastery) ? merged.wordMastery : {};
        merged.wordMastery = Object.fromEntries(Object.entries(rawMastery)
          .filter(([key]) => /^[a-z][a-z0-9_-]{0,39}$/i.test(key))
          .slice(0,1000)
          .map(([key,value]) => [key,safeInteger(value,0,0,5)]));
        merged.goal = [5,10,15].includes(Number(merged.goal)) ? Number(merged.goal) : 10;
        // Existing users who have finished onboarding already chose a goal; never show the first-run chooser again.
        merged.goalChosen = merged.goalChosen === true || merged.onboardingDone === true || merged.onboardingStep === 'warmup' || merged.warmupDone === true;
        merged.onboardingStep = typeof merged.onboardingStep === 'string' ? merged.onboardingStep.slice(0,24) : '';
        for (const key of ['crystals','xp','streak','lessonsCompleted','totalCorrect','totalAnswered','vocabLearned']) merged[key] = safeInteger(merged[key],0);
        merged.dailyMinutes = safeInteger(merged.dailyMinutes,0,0,1440);
        merged.dailyCompletedLessons = safeList(merged.dailyCompletedLessons).slice(0,500);
        merged.ownedSkins = safeList(merged.ownedSkins);
        if (!merged.ownedSkins.includes('default')) merged.ownedSkins.unshift('default');
        merged.ownedSkins = merged.ownedSkins.filter(id => ['default','gold','cyber','hero'].includes(id));
        const validThemes = ['aurora','ocean','lavender','sunset','forest','midnight','rose','galaxy'];
        merged.ownedThemes = safeList(merged.ownedThemes).filter(id => validThemes.includes(id));
        for (const id of ['aurora','ocean','lavender']) if (!merged.ownedThemes.includes(id)) merged.ownedThemes.push(id);
        if (!validThemes.includes(merged.selectedTheme) || !merged.ownedThemes.includes(merged.selectedTheme)) merged.selectedTheme = 'aurora';
        merged.claimedAchievements = safeList(merged.claimedAchievements).slice(0,100);
        merged.levelRewardsClaimed = Array.isArray(merged.levelRewardsClaimed) ? [...new Set(merged.levelRewardsClaimed.map(v => safeInteger(v,0,1,100000)))] : [];
        if (!merged.levelRewardsClaimed.length) merged.levelRewardsClaimed = Array.from({length:Math.max(0,Math.floor(safeInteger(merged.xp,0)/50))},(_,i)=>i+2);
        merged.lessonHistory = Array.isArray(merged.lessonHistory) ? merged.lessonHistory.filter(row => row && typeof row.lessonId === 'string' && /^[a-z0-9_-]{1,40}$/i.test(row.lessonId) && /^\d{4}-\d{2}-\d{2}$/.test(row.date || '')).slice(-100).map(row => ({lessonId:row.lessonId,date:row.date,correct:safeInteger(row.correct,0,0,100),total:safeInteger(row.total,0,0,100),xp:safeInteger(row.xp,0),crystals:safeInteger(row.crystals,0)})) : [];
        merged.exerciseHistory = Array.isArray(merged.exerciseHistory) ? merged.exerciseHistory.filter(row => row && typeof row.lessonId === 'string' && /^[a-z0-9_-]{1,40}$/i.test(row.lessonId) && ['flashcard','builder','quiz','grammar','review','warmup','dialog'].includes(row.type) && /^\d{4}-\d{2}-\d{2}$/.test(row.date || '')).slice(-1000).map(row => ({lessonId:row.lessonId,type:row.type,itemId:String(row.itemId || '').slice(0,40),answer:String(row.answer || '').slice(0,120),correct:row.type==='flashcard'?null:(row.correct===null?null:row.correct===true),date:row.date,at:safeInteger(row.at,0,0,Number.MAX_SAFE_INTEGER)})) : [];
        merged.dailyGoalClaimedDate = typeof merged.dailyGoalClaimedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(merged.dailyGoalClaimedDate) ? merged.dailyGoalClaimedDate : '';
        merged.energy = safeInteger(merged.energy,ENERGY_MAX,0,ENERGY_MAX);
        merged.energyUpdatedAt = safeInteger(merged.energyUpdatedAt,Date.now(),0,Number.MAX_SAFE_INTEGER);
        if (!['default','gold','cyber','hero'].includes(merged.selectedSkin) || !merged.ownedSkins.includes(merged.selectedSkin)) merged.selectedSkin = 'default';
        merged.onboardingDone = merged.onboardingDone === true;
        merged.warmupDone = merged.warmupDone === true;
        // PRO-доступ никогда не восстанавливается из клиентского хранилища — его подтверждает Worker.
        merged.proActive = false;
        merged.demoPro = DEMO_PRO_ALLOWED && merged.demoPro === true;
        if (merged.dailyDate !== localDateKey()) {
          merged.dailyMinutes = 0;
          merged.dailyCompletedLessons = [];
          merged.dailyDate = localDateKey();
        }
        return merged;
      } catch (_) { return freshState(); }
    }

    function parseProgressSnapshot(raw) {
      if (typeof raw !== 'string' || !raw) return null;
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return null;
        // Поддерживаем и старый формат localStorage, где хранился непосредственно state.
        const isEnvelope = parsed.format === 'lumi-progress-v1' && parsed.state && typeof parsed.state === 'object';
        const savedState = isEnvelope ? parsed.state : parsed;
        const updatedAt = isEnvelope && Number.isFinite(Number(parsed.updatedAt)) ? Math.max(0, Math.floor(Number(parsed.updatedAt))) : 0;
        return { state: normalizeState(savedState), updatedAt };
      } catch (_) { return null; }
    }

    function readLocalProgressSnapshot() {
      try { return parseProgressSnapshot(localStorage.getItem(STORAGE_KEY)); }
      catch (_) { return null; }
    }

    function loadState() {
      const localSnapshot = readLocalProgressSnapshot();
      if (localSnapshot) {
        stateUpdatedAt = localSnapshot.updatedAt;
        return localSnapshot.state;
      }
      stateUpdatedAt = 0;
      return normalizeState(null);
    }

    function createProgressEnvelope(forCloud = false) {
      const savedState = { ...state };
      // Локальные DEMO-флаги и клиентский PRO-статус не должны переноситься между устройствами.
      if (forCloud) {
        savedState.proActive = false;
        savedState.demoPro = false;
        delete savedState.proExpiresAt;
      }
      return { format:'lumi-progress-v1', updatedAt:stateUpdatedAt, state:savedState };
    }

    function writeLocalProgressSnapshot() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(createProgressEnvelope(false)));
        return true;
      } catch (error) {
        console.warn('Lumi local progress save failed:', error);
        return false;
      }
    }

    function getCloudStorageApi() {
      const webApp = window.Telegram && window.Telegram.WebApp;
      const cloud = webApp && webApp.CloudStorage;
      if (!cloud || typeof cloud.getItem !== 'function' || typeof cloud.setItem !== 'function') return null;
      return cloud;
    }

    function callCloudStorage(method, ...args) {
      return new Promise((resolve, reject) => {
        const cloud = getCloudStorageApi();
        if (!cloud || typeof cloud[method] !== 'function') {
          reject(new Error('Telegram CloudStorage недоступен.'));
          return;
        }
        let settled = false;
        const timeout = window.setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error(`CloudStorage.${method}: превышено время ожидания.`));
        }, 5000);
        const callback = (error, result) => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeout);
          if (error) reject(new Error(String(error)));
          else resolve(result);
        };
        try { cloud[method](...args, callback); }
        catch (error) {
          if (!settled) {
            settled = true;
            window.clearTimeout(timeout);
            reject(error);
          }
        }
      });
    }

    function updateStorageStatusUI() {
      const note = document.getElementById('cloudStorageStatusNote');
      if (!note) return;
      note.textContent = storageStatusText();
    }

    function storageStatusText() {
      const messages = {
        checking: '⏳ Проверяем облачное сохранение Telegram…',
        cloud: '☁️ Прогресс синхронизирован с Telegram и сохранён на устройстве',
        local: '💾 Локальное сохранение включено · открой Mini App в Telegram для облачной синхронизации',
        error: '⚠️ Локальная копия сохранена · облачная синхронизация временно недоступна'
      };
      return messages[cloudStorageStatus] || messages.local;
    }

    async function initializeProgressStorage() {
      const localSnapshot = readLocalProgressSnapshot();
      if (localSnapshot) {
        state = localSnapshot.state;
        stateUpdatedAt = localSnapshot.updatedAt;
      }
      const cloud = getCloudStorageApi();
      if (!cloud) {
        cloudStorageReady = false;
        cloudStorageStatus = 'local';
        progressStorageReady = true;
        updateStorageStatusUI();
        return;
      }
      try {
        const cloudRaw = await callCloudStorage('getItem', CLOUD_STORAGE_KEY);
        cloudStorageReady = true;
        let cloudSnapshot = null;
        try {
          let cloudManifest = null;
          try { cloudManifest = cloudRaw ? JSON.parse(cloudRaw) : null; } catch (_) { cloudManifest = null; }
          if (cloudManifest && cloudManifest.format === 'lumi-cloud-manifest-v2' && Number.isInteger(cloudManifest.count) && cloudManifest.count > 0 && cloudManifest.count <= 100) {
            let combined = '';
            for (let i = 0; i < cloudManifest.count; i++) {
              const part = await callCloudStorage('getItem', `${CLOUD_STORAGE_KEY}_part_${cloudManifest.generation}_${i}`);
              if (typeof part !== 'string') throw new Error('Отсутствует часть ' + i);
              combined += part;
            }
            cloudSnapshot = parseProgressSnapshot(combined);
            if (!cloudSnapshot || combined.length !== cloudManifest.length) throw new Error('Облачное сохранение повреждено.');
            cloudSnapshot.updatedAt = Math.max(cloudSnapshot.updatedAt, Number(cloudManifest.updatedAt) || 0);
          } else {
            // Migration: older Lumi versions stored the entire snapshot in one CloudStorage value.
            cloudSnapshot = parseProgressSnapshot(cloudRaw);
          }
        } catch (cloudReadError) {
          console.warn('Lumi cloud snapshot could not be reconstructed; local copy will be used:', cloudReadError);
          cloudSnapshot = null;
        }
        if (cloudSnapshot && (!localSnapshot || cloudSnapshot.updatedAt >= localSnapshot.updatedAt)) {
          state = cloudSnapshot.state;
          stateUpdatedAt = cloudSnapshot.updatedAt;
          writeLocalProgressSnapshot();
        } else if (localSnapshot) {
          state = localSnapshot.state;
          stateUpdatedAt = Math.max(localSnapshot.updatedAt, Date.now());

    function splitCloudValueUtf8(value, maxBytes = 3500) {
      const encoder = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
      const chunks = [];
      let current = '', bytes = 0;
      for (const character of value) {
        const size = encoder ? encoder.encode(character).length : unescape(encodeURIComponent(character)).length;
        if (bytes + size > maxBytes && current) { chunks.push(current); current = ''; bytes = 0; }
        current += character; bytes += size;
      }
      if (current || !chunks.length) chunks.push(current);
      return chunks;
    }

    async function writeCloudProgressSnapshot() {
      if (!cloudStorageReady) return;
      const raw = JSON.stringify(createProgressEnvelope(true));
      // CloudStorage values are limited to 4096 characters. Store immutable chunks,
      // then atomically switch the manifest only after every chunk was accepted.
      const generation = `${stateUpdatedAt || Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      const chunks = splitCloudValueUtf8(raw, 3500);
      cloudWriteQueue = cloudWriteQueue.catch(() => {}).then(async () => {
        const previousRaw = await callCloudStorage('getItem', CLOUD_STORAGE_KEY).catch(() => null);
        let previousManifest = null;
        try { previousManifest = previousRaw ? JSON.parse(previousRaw) : null; } catch (_) {}
        for (let i = 0; i < chunks.length; i++) {
          const stored = await callCloudStorage('setItem', `${CLOUD_STORAGE_KEY}_part_${generation}_${i}`, chunks[i]);
          if (stored === false) throw new Error(`Telegram не подтвердил часть ${i + 1}.`);
        }
        const manifest = JSON.stringify({format:'lumi-cloud-manifest-v2',generation,count:chunks.length,length:raw.length,updatedAt:stateUpdatedAt});
        const committed = await callCloudStorage('setItem', CLOUD_STORAGE_KEY, manifest);
        if (committed === false) throw new Error('Telegram не подтвердил индекс сохранения.');
        if (previousManifest && previousManifest.format === 'lumi-cloud-manifest-v2' && previousManifest.generation !== generation && Number.isInteger(previousManifest.count)) {
          for (let i = 0; i < Math.min(previousManifest.count,100); i++) {
            try { await callCloudStorage('removeItem', `${CLOUD_STORAGE_KEY}_part_${previousManifest.generation}_${i}`); } catch (_) { break; }
          }
        }
      });
      cloudWriteQueue.then(() => {
        cloudStorageStatus = 'cloud';
        updateStorageStatusUI();
      }).catch(error => {
        cloudStorageStatus = 'error';
        console.warn('Lumi CloudStorage save failed; local copy is still available:', error);
        updateStorageStatusUI();
      });
      return cloudWriteQueue;
    }

    const allLessons = allPlanets.flatMap(planet => planet.lessons.map(lesson => ({ ...lesson, planetId:planet.id, planetName:planet.name, planetIcon:planet.icon, isPro:planet.pro === true })));
    const bookCategories = ['Все','Общение','Еда','Путешествия','Сленг','IT и игры','Фильмы','Повседневность','Город','Природа','Самочувствие','Покупки','Учёба','Цифровой мир','Хобби','Грамматика'];

    function learnedWordIdsForLesson(lesson) {
      const lessonIndex = allLessons.findIndex(item => item.id === lesson.id);
      const previous = allLessons.slice(0, Math.max(0, lessonIndex)).filter(item => state.completedLessons.includes(item.id)).flatMap(item => item.words);
      return [...new Set([...state.learnedWords, ...previous, ...lesson.words])];
    }
    function validateCurriculum() {
      const seen = new Set(state.warmupDone && state.learnedWords.includes('hello') ? ['hello'] : []);
      for (const lesson of allLessons) {
        for (const wordId of lesson.words) {
          if (!wordCatalog[wordId]) throw new Error(`Неизвестная карточка слова: ${wordId}`);
        }
        const available = new Set([...seen, ...lesson.words]);
        for (const [wordId] of lesson.sentenceTokens) {
          if (!available.has(wordId)) throw new Error(`В уроке ${lesson.id} используется слово до изучения: ${wordId}`);
        }
        for (const wordId of (lesson.requiresWords || [])) {
          if (!seen.has(wordId)) throw new Error(`В уроке ${lesson.id} неверная предпосылка: ${wordId} ещё не встречалась ранее`);
        }
        if (lesson.sentenceTokens.length < 2) throw new Error(`Слишком короткое предложение в ${lesson.id}`);
        if (lesson.grammar) {
          const question=lesson.grammar.question;
          if (!lesson.grammar.tense || !lesson.grammar.structure || !lesson.grammar.usage || !lesson.grammar.example || !question || !Array.isArray(question.options) || question.options.length < 2 || !Number.isInteger(question.correct) || question.correct < 0 || question.correct >= question.options.length) throw new Error(`Некорректная структура грамматического урока: ${lesson.id}`);
        }
        lesson.words.forEach(wordId => seen.add(wordId));
      }
    }
    try { validateCurriculum(); } catch (error) { console.error('Lumi curriculum validation:', error); }

    function setNavVisible(visible) {
      document.getElementById('bottomNav').hidden = !visible;
      document.getElementById('topStats').style.visibility = visible ? 'visible' : 'hidden';
    }
    function render() {
      applySelectedTheme();
      refreshEnergy();
      updateTopStats();
      if (!state.onboardingDone) { setNavVisible(false); renderWelcome(); return; }
      setNavVisible(true);
      if (lessonSession) { renderLesson(); return; }
      if (dialogSession) { renderDialogSession(); return; }
      const screen = document.getElementById('screen');
      const wordPopover = document.getElementById('wordPopover'); if (wordPopover) wordPopover.hidden = true;
      if (currentTab === 'map') screen.innerHTML = renderMap();
      else if (currentTab === 'book') screen.innerHTML = renderBook();
      else if (currentTab === 'profile') screen.innerHTML = renderProfile();
      else if (currentTab === 'pro') screen.innerHTML = renderPro();
      screen.scrollTop = 0;
      document.querySelectorAll('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.tab === currentTab));
      bindPageEvents();
    }

    function renderWelcome() {
      const screen = document.getElementById('screen');
      // A saved goal is never asked again. Resume the one-question warm-up, or finish onboarding if it was already completed.
      if (state.goalChosen) {
        if (!state.warmupDone) {
          if (state.onboardingStep !== 'warmup') { state.onboardingStep = 'warmup'; saveState(); }
          renderWarmup();
          return;
        }
        state.onboardingDone = true;
        state.onboardingStep = 'completed';
        saveState();
        render();
        return;
      }
      screen.innerHTML = `<div class="welcome page">
        ${lumiArt()}
        <div class="eyebrow">ТВОЯ МИССИЯ НАЧИНАЕТСЯ</div>
        <h1>Привет! Я Луми 👋<br>Полетим за английским?</h1>
        <p>Я твой космический напарник. Будем открывать планеты, собирать кристаллы и учить английский маленькими шагами.</p>
        <div class="card" style="padding:15px;text-align:left">
          <h3 style="margin:0;text-align:center">Сколько минут в день тебе удобно заниматься английским?</h3>
          <p class="small muted" style="text-align:center;margin:7px 0 0">Выбор задаёт ежедневный план, а не просто украшает профиль.</p>
          <div class="goal-picks">
            ${[5,10,15].map(value => `<button class="goal-pick ${selectedGoal === value ? 'selected' : ''}" data-goal="${value}"><strong>${value}</strong><span>МИНУТ</span><small>${goalOptionCaption(value)}</small></button>`).join('')}
          </div>
          <button class="btn full" id="goalContinue">Выбрать и начать 🚀</button>
        </div>
        <div class="footer-note">Без оценок и спешки. Учимся в своём темпе ✨</div>
      </div>`;
      screen.querySelectorAll('[data-goal]').forEach(button => button.addEventListener('click', () => {
        tap(); selectedGoal = Number(button.dataset.goal);
        screen.querySelectorAll('[data-goal]').forEach(item => item.classList.toggle('selected', item === button));
      }));
      document.getElementById('goalContinue').addEventListener('click', () => {
        tap(); state.goal = selectedGoal; state.goalChosen = true; state.onboardingStep = 'warmup'; saveState(); renderWarmup();
      });
    }

    function renderWarmup() {
      const screen = document.getElementById('screen');
      screen.scrollTop = 0;
      screen.innerHTML = `<div class="page">
        <div class="lesson-header"><button class="icon-btn lesson-close" id="exitWarmup" aria-label="Выйти из разминки" title="Выйти">✕</button><div class="lesson-progress" id="warmupProgress" role="progressbar" aria-label="Прогресс разминки" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span style="width:0%"></span></div><div class="lesson-count">1/1</div></div>
        <div class="page-head"><div class="eyebrow">МИКРО-РАЗМИНКА · 1 ВОПРОС</div><h1>Первое космическое слово!</h1><p>Сначала познакомься со словом, затем выбери его точный перевод.</p></div>
        <div class="card word-learning-card">

      </div>`;
      let picked = null;
      let checked = false;
      document.getElementById('exitWarmup').addEventListener('click', () => { tap(); openExitModal('warmup'); });
      document.getElementById('warmupSpeak').addEventListener('click', () => { tap(); speakWord('hello'); });
      screen.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => {
        if (checked) return;
        tap(); picked = Number(button.dataset.answer);
        screen.querySelectorAll('[data-answer]').forEach(item => item.classList.toggle('selected', item === button));
        document.getElementById('warmupCheck').disabled = false;
      }));
      document.getElementById('warmupCheck').addEventListener('click', () => {
        if (checked || picked === null) return;
        const feedback = document.getElementById('warmupFeedback');
        const options = [...screen.querySelectorAll('[data-answer]')];
        const correct = picked === 0;
        checked = true;
        const progress = document.getElementById('warmupProgress');
        if (progress) { progress.setAttribute('aria-valuenow','1'); progress.querySelector('span').style.width = '100%'; }
        options.forEach((item,index) => { item.disabled = true; if (index === 0) item.classList.add('correct'); else if (index === picked) item.classList.add('wrong'); });
        feedback.className = `feedback show ${correct ? 'good' : 'bad'}`;
        feedback.innerHTML = correct ? '<strong>Идеально! 🚀</strong> Hello — это «Привет». Первое слово уже в твоём учебнике.' : '<strong>Ничего страшного!</strong> Правильный ответ — «Привет». Hello уже отправляется в учебник.';
        const mascot = screen.querySelector('.lumi-wrap'); if (mascot) mascot.classList.add(correct ? 'is-happy' : 'is-sad');
        if (correct) { sound('success'); haptic('success'); addCrystals(10); addXp(10); state.totalCorrect += 1; }
        else { sound('error'); haptic('soft'); addCrystals(3); }
        if (!state.learnedWords.includes('hello')) state.learnedWords.push('hello');
        state.wordMastery.hello = Math.max(1, Number(state.wordMastery.hello) || 0);
        state.vocabLearned = state.learnedWords.length;
        recordExerciseTask('warmup-1','warmup','hello',options[picked]?.textContent?.trim() || '',correct);
        state.totalAnswered += 1; state.dailyMinutes = Math.min(state.goal, state.dailyMinutes + 1); state.warmupDone = true; state.onboardingDone = true; state.goalChosen = true; state.onboardingStep = 'completed';
        registerActiveDay(localDateKey()); saveState();
        const check = document.getElementById('warmupCheck'); check.textContent = 'Открыть карту планет 🪐'; check.classList.toggle('green', correct); check.disabled = false;
        check.onclick = () => { tap(); currentTab = 'map'; render(); showToast(correct ? 'Ты получил 10 кристаллов! 💎' : 'За смелость — 3 кристалла! 💎'); };
      });
    }

    function registerActiveDay(day) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return;
      if (state.streakLastDate === day || state.activeDays.includes(day)) { state.today=day; return; }
      const lastDate=state.streakLastDate || state.activeDays.slice().sort().slice(-1)[0] || (state.streak>0?state.today:'');
      if (!lastDate) state.streak=Math.max(1,state.streak||0);
      else {
        const lastMs=Date.parse(lastDate+'T00:00:00');
        const currentMs=Date.parse(day+'T00:00:00');
        const difference=Math.round((currentMs-lastMs)/86400000);
        const missed=Math.max(0,difference-1);
        if (difference<=0) state.streak=Math.max(1,state.streak||0);
        else if (missed===0) state.streak=Math.max(1,state.streak+1);
        else if (isProEnabled() && missed<=3) {
          state.streak=Math.max(1,state.streak+1);
          for(let i=1;i<=missed;i++){const frozen=new Date(lastMs+i*86400000);const key=localDateKey(frozen);if(!state.cryoFreezeDates.includes(key))state.cryoFreezeDates.push(key);}
        } else if (!isProEnabled() && missed===1 && !state.freeFreezeUsed) {
          state.freeFreezeUsed=true; state.streak=Math.max(1,state.streak+1);
          const frozen=localDateKey(new Date(lastMs+86400000)); if(!state.cryoFreezeDates.includes(frozen))state.cryoFreezeDates.push(frozen);
        } else state.streak=1;
      }
      if (!state.activeDays.includes(day)) state.activeDays.push(day);
      state.activeDays=state.activeDays.slice(-30);
      state.cryoFreezeDates=state.cryoFreezeDates.slice(-90);
      state.streakLastDate=day; state.today=day;
    }

    // The 5/10/15-minute choice sets a concrete daily lesson plan: approximately 1/2/3 missions.
    function dailyLessonTarget(goal = state.goal) { return Math.max(1, Math.min(3, Math.round(Number(goal || 10) / 5))); }
    function dailyLessonProgress() {
      if (state.dailyDate !== localDateKey()) {
        state.dailyDate = localDateKey(); state.dailyMinutes = 0; state.dailyCompletedLessons = [];
      }
      return Math.min(dailyLessonTarget(), state.dailyCompletedLessons.length);
    }
    function recordDailyLessonCompletion(lessonId) {
      const today = localDateKey();
      if (state.dailyDate !== today) {
        state.dailyDate = today; state.dailyMinutes = 0; state.dailyCompletedLessons = [];
      }
      if (!state.dailyCompletedLessons.includes(lessonId)) state.dailyCompletedLessons.push(lessonId);
      const target = dailyLessonTarget();
      if (state.dailyCompletedLessons.length >= target && state.dailyGoalClaimedDate !== today) {
        state.dailyGoalClaimedDate = today;
        const bonusXp = addXp(15);
        addCrystals(15);
        return { reached:true, bonusXp };
      }
      return { reached:false, bonusXp:0 };
    }
    function goalOptionCaption(value) {
      const lessons = dailyLessonTarget(value);
      return `${lessons} ${plural(lessons,'урок','урока','уроков')} в день`;
    }

    function knownWordSet() {
      const known = new Set(state.learnedWords || []);
      if (state.warmupDone) known.add('hello');
      for (const item of allLessons) {
        if (state.completedLessons.includes(item.id)) item.words.forEach(id => known.add(id));
      }
      return known;
    }
    function isLessonUnlocked(lessonId) {
      const lesson = allLessons.find(item => item.id === lessonId);
      if (!lesson) return false;
      if (lesson.isPro && !isProEnabled()) return false;
      if (state.completedLessons.includes(lessonId)) return true;
      const planet = allPlanets.find(item => item.id === lesson.planetId);
      if (!planet) return false;
      const lessonIndex = planet.lessons.findIndex(item => item.id === lessonId);
      if (lessonIndex < 0) return false;
      if (lessonIndex > 0 && !state.completedLessons.includes(planet.lessons[lessonIndex - 1].id)) return false;
      if (!planet.pro) {
        const freeIndex = planets.findIndex(item => item.id === planet.id);
        if (freeIndex > 0 && !state.completedLessons.includes(planets[freeIndex - 1].lessons[planets[freeIndex - 1].lessons.length - 1].id)) return false;
      }
      const known = knownWordSet();
      return (lesson.requiresWords || []).every(wordId => known.has(wordId));
    }
    function renderPlanetCard(planet, planetIndex, isProPlanet = false) {
      const planetDone = planet.lessons.filter(lesson => state.completedLessons.includes(lesson.id)).length;
      // A planet already entered by the learner stays open for replay, even if
      // older prerequisite data was migrated or an earlier planet is incomplete.
      const planetHasCompletedLesson = planet.lessons.some(lesson => state.completedLessons.includes(lesson.id));
      const previousPlanetCompleted = isProPlanet || planetIndex === 0 || state.completedLessons.includes(planets[planetIndex - 1].lessons[planets[planetIndex - 1].lessons.length - 1].id);
      const planetUnlocked = isProPlanet ? isProEnabled() : (previousPlanetCompleted || planetHasCompletedLesson);
      return `<section class="card course-planet ${planetUnlocked ? '' : 'locked'}">
        <div class="course-planet-head"><div class="course-planet-icon" style="background:${planet.color}">${planet.icon}</div><div class="course-planet-copy"><h2>${escapeHtml(planet.name)}</h2><p>${escapeHtml(planet.subtitle)}</p></div>${isProPlanet ? '<span class="pro-planet-label">⭐ PRO</span>' : `<div class="course-planet-count">${planetDone}/${planet.lessons.length}</div>`}</div>
        <div class="course-planet-track"><span style="width:${planetDone/planet.lessons.length*100}%"></span></div>
        <div class="lesson-node-list">${planet.lessons.map((lesson,lessonIndex) => {
          const completed = state.completedLessons.includes(lesson.id);
          const unlocked = planetUnlocked && isLessonUnlocked(lesson.id);
          const globalIndex = allLessons.findIndex(item => item.id === lesson.id) + 1;
          const missingWords = (lesson.requiresWords || []).filter(wordId => !knownWordSet().has(wordId));
          const requirementHint = missingWords.length ? ` · сначала изучи: ${missingWords.map(wordId => wordCatalog[wordId]?.en || wordId).join(', ')}` : '';
          return `<button class="lesson-node ${completed?'done':''}" data-lesson="${lesson.id}" ${unlocked?'':'disabled'}>
            <span class="lesson-node-number">${completed?'✓':globalIndex}</span>
            <span class="lesson-node-copy"><strong>${escapeHtml(lesson.title)}</strong><span>${escapeHtml(lesson.subtitle)} · ${lesson.words.length} карточек${completed?' · завершён · можно повторить':''}${requirementHint ? escapeHtml(requirementHint) : ''}</span></span>
            <span class="lesson-node-status">${completed?'↻':unlocked?'▶️':'🔒'}</span>
          </button>`;
        }).join('')}</div>
        ${isProPlanet && !isProEnabled() ? '<div class="pro-locked-note">Эта планета входит в Lumi PRO. Включи ДЕМО-PRO в профиле или оформи подписку, чтобы открыть её.</div>' : ''}
      </section>`;
    }
    function renderMap() {
      const visibleLessonCount = isProEnabled() ? allLessons.length : planets.reduce((sum, planet) => sum + planet.lessons.length, 0);
      const done = allLessons.filter(lesson => state.completedLessons.includes(lesson.id) && (isProEnabled() || !lesson.isPro)).length;
      const progress = Math.min(100, Math.round(done / visibleLessonCount * 100));
      const hearts = isProEnabled() ? '∞ без ограничений' : `${state.energy}/${ENERGY_MAX} сердечек`;
      const dailyTarget = dailyLessonTarget();
      const dailyDone = dailyLessonProgress();
      const dailyPercent = Math.min(100, Math.round(dailyDone / dailyTarget * 100));
      const dailyClaimed = state.dailyGoalClaimedDate === localDateKey();
      return `<div class="page">
        <section class="card hero">
          <div class="hero-copy"><div class="eyebrow">КОСМИЧЕСКАЯ АКАДЕМИЯ</div><h1>С возвращением,<br>кадет!</h1><p>Луми приготовил ${isProEnabled() ? allLessons.length : planets.reduce((n,p)=>n+p.lessons.length,0)} коротких миссий. Новые слова появляются маленькими порциями.</p></div>
          <div class="hero-mascot">${lumiArt()}</div>
        </section>
        <section class="card daily-card">
          <div class="section-row"><h2>Твоя цель на сегодня</h2><button class="tiny-link" id="changeGoal">Изменить</button></div>
          <div class="progress-line"><span>План: ${state.goal} минут · примерно ${goalOptionCaption(state.goal)}</span><strong>${dailyDone} / ${dailyTarget} миссий</strong></div>
          <div class="goal-track"><div class="goal-fill" style="width:${dailyPercent}%"></div></div>
          <div class="progress-line"><span>${dailyClaimed ? 'Дневная цель выполнена — бонус получен!' : dailyDone >= dailyTarget ? 'Цель достигнута!' : `Ещё ${dailyTarget-dailyDone} ${plural(dailyTarget-dailyDone,'миссия','миссии','миссий')} до награды`}</span><span>${dailyPercent}%</span></div>
          <div class="progress-line" style="margin-top:8px"><span>Путь по Академии</span><span>${done}/${visibleLessonCount} уроков · ${progress}%</span></div>
          <div class="daily-energy-row"><span>Энергия кадета</span><span class="energy-hearts">${isProEnabled() ? '♾️ Безлимитная энергия' : `❤️ ${hearts}`}</span></div>
          ${!isProEnabled() && state.energy < ENERGY_MAX ? `<div class="small muted" style="margin-top:5px">Следующее сердечко восстановится через ${Math.max(1,Math.ceil((ENERGY_REGEN_MS-(Date.now()-Number(state.energyUpdatedAt||Date.now())))/60000))} мин.</div>` : ''}
        </section>
        ${renderLeagueCard()}
        <div class="section-row" style="margin:19px 2px 10px"><h2>Бесплатные планеты</h2><span class="muted small">${planets.length} миров · ${planets.reduce((n,p)=>n+p.lessons.length,0)} уроков</span></div>
        ${planets.map((planet,index) => renderPlanetCard(planet,index,false)).join('')}
        <div class="section-row" style="margin:20px 2px 10px"><h2>Секретные миры</h2><span class="pro-planet-label">⭐ ${proPlanets.length} PRO</span></div>
        ${proPlanets.map((planet,index) => renderPlanetCard(planet,index,true)).join('')}
        <div class="footer-note">Ошибки расходуют энергию, но помогают учиться. В Lumi PRO энергия бесконечна 💫</div>
      </div>`;
    }

    function renderEnglishTokens(tokens, className = 'lesson-prompt-word') {
      return tokens.map(token => {
        const entry = wordCatalog[token[0]];
        return `<button type="button" class="${className}" data-word-tip="${token[0]}" aria-label="Перевод слова ${escapeHtml(entry.en)}">${escapeHtml(token[1])}</button>`;
      }).join(' ');
    }
    function masteryValue(wordId) {
      return Math.max(0, Math.min(5, Number(state.wordMastery[wordId]) || 0));
    }
    function renderReviewPanel() {
      if (!reviewSession) return '';
      const session = reviewSession;
      if (session.finished) {
        return `<section class="card review-card"><div class="review-result">${lumiArt('is-happy')}<div class="eyebrow">БЛИЦ ЗАВЕРШЁН</div><h2>Отличная работа!</h2><p class="small muted">Верно: ${session.correct} из ${session.wordIds.length}. Прогресс запоминания обновлён.</p><button class="btn green full" id="closeReview">Вернуться к учебнику</button></div></section>`;
      }
      const wordId = session.wordIds[session.index];
      const word = wordCatalog[wordId];
      return `<section class="card review-card">
        <div class="review-title"><h2>Повторение слов ✨</h2><span class="small muted">${session.index + 1}/${session.wordIds.length}</span></div>
        <div class="lesson-mascot-row">${lumiArt()}<div><div class="eyebrow">ЛУМИ ПОВТОРЯЕТ С ТОБОЙ</div><strong>Как переводится это слово?</strong></div></div>
        <div class="quiz-word-card"><button class="lesson-prompt-word" data-word-tip="${word.id}">${escapeHtml(word.en)}</button><span>Выбери точный перевод</span></div>
        <div class="answer-list">${session.options.items.map((option,index) => `<button class="answer-option ${session.checked && index===session.options.correctIndex?'correct':''} ${session.checked && index===session.selected && index!==session.options.correctIndex?'wrong':''} ${session.selected===index?'selected':''}" data-review-option="${index}" ${session.checked?'disabled':''}>${escapeHtml(option.ru)}</button>`).join('')}</div>
        <div class="feedback ${session.checked?'show '+(session.selected===session.options.correctIndex?'good':'bad'):''}">${session.checked ? (session.selected===session.options.correctIndex ? 'Верно! Слово запомнено лучше 💜' : `Правильный ответ: ${escapeHtml(word.ru)}.`) : ''}</div>
        <button class="btn full" id="reviewAction" ${session.checked?'':'disabled'}>${session.checked ? (session.index === session.wordIds.length-1 ? 'Завершить блиц' : 'Следующее слово') : 'Проверить ответ'}</button>
      </section>`;

    function plural(number, one, few, many) {

      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
      return many;
    }

      for (let i=options.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }

        proAccount={startedAt:latest.startedAt||0,expiresAt:latest.expiresAt||0,months:latest.months||0,wasPro:latest.wasPro===true||latest.active===true,autoRenew:latest.autoRenew,billingState:latest.billingState||'ok'};
        state.proActive=latest.active===true;
        if(latest.active){saveState();render();showToast(`Lumi PRO уже активен до ${formatProDate(latest.expiresAt)}. Новая покупка откроется после окончания срока.`);return;}
        saveState();
        const base=new URL(WORKER_URL.trim());
        const response=await fetch(`${base.href.replace(/\/$/,'')}/create-invoice?user_id=${encodeURIComponent(userId)}`,{
          method:'POST',headers:{...workerAuthHeaders(),'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})
        });
        const payload=await response.json().catch(()=>({}));
        const invoiceLink=payload.invoice_link||payload.invoiceUrl;
        if(!response.ok||!invoiceLink)throw new Error(payload.error||'Worker не вернул ссылку Telegram invoice.');
        const invoiceUrl=new URL(invoiceLink);
        if(invoiceUrl.protocol!=='https:'||!['t.me','telegram.me'].includes(invoiceUrl.hostname)||invoiceUrl.username||invoiceUrl.password)throw new Error('Worker вернул ссылку, которая не ведёт на официальный Telegram.');
        tg.openInvoice(invoiceUrl.href,async status=>{
          purchaseInFlight=false;setBusy(false);
          if(status==='paid'){
            showToast('Платёж получен! Подтверждаю Lumi PRO…');
            await refreshProStatusFromServer(true);
          }else if(status==='pending'){
            showToast('Платёж обрабатывается. Проверяю подписку…');
            await refreshProStatusFromServer(false);
          }else if(status==='cancelled')showToast('Оплата отменена. Списание не подтверждено.');
          else if(status==='failed')showToast('Платёж не прошёл. Попробуй ещё раз.');
          else showToast('Окно оплаты закрыто. Статус: '+String(status||'неизвестен'));
        });
        invoiceOpened=true;
      }catch(error){console.error('Lumi invoice error:',error);showToast(error.message||'Не удалось создать счёт. Проверь настройки Worker.');}
      finally{if(!invoiceOpened){purchaseInFlight=false;setBusy(false);}}
    }
    async function requestProStatus() {
      if(!tg||!tg.initData||!workerIsConfigured())throw new Error('Не настроена проверка Telegram PRO.');
      const userId=telegramUserId();if(!userId)throw new Error('Telegram user.id отсутствует.');
      const base=new URL(WORKER_URL.trim());
      const response=await fetch(`${base.href.replace(/\/$/,'')}/check-pro?user_id=${encodeURIComponent(userId)}`,{method:'GET',headers:workerAuthHeaders(),cache:'no-store'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||typeof data.is_pro!=='boolean')throw new Error(data.error||'Worker вернул некорректный PRO-статус.');
      return {active:data.is_pro,expiresAt:data.expires_at||0,startedAt:data.started_at||0,months:data.months_in_pro||data.months_paid||0,wasPro:data.was_pro===true,autoRenew:data.auto_renew!==false,billingState:data.billing_state||'ok'};
    }
    async function refreshProStatusFromServer(afterPaid=false) {
      try{
        let data={active:false};
        const attempts=afterPaid?25:1;
        for(let attempt=0;attempt<attempts;attempt++){
          data=await requestProStatus();
          if(data.active)break;
          if(attempt<attempts-1)await new Promise(resolve=>window.setTimeout(resolve,2500));
        }
        const wasActive=state.proActive===true;
        state.proActive=data.active===true;
        proAccount={startedAt:data.startedAt||0,expiresAt:data.expiresAt||0,months:data.months||0,wasPro:data.wasPro||data.active,autoRenew:data.autoRenew,billingState:data.billingState||'ok'};
        if(!isProEnabled()&&['sunset','forest','midnight','rose','galaxy'].includes(state.selectedTheme))state.selectedTheme='aurora';
        saveState();render();
        if(state.proActive&&!wasActive){celebrateProActivation();showToast('⭐ Поздравляем! Lumi PRO активирован. Луми и дрон снова вместе!');}
        else if(state.proActive)showToast('Lumi PRO активен до '+formatProDate(proAccount.expiresAt));
        else if(afterPaid)showToast('Telegram принял платёж, но Worker ещё не получил подтверждение. Не покупай повторно — проверь webhook.');
        else showToast('Статус Lumi PRO обновлён.');
      }catch(error){console.error('Lumi PRO verification:',error);if(afterPaid)showToast('Оплата прошла, но сервер пока не подтвердил доступ. Не покупай повторно — проверь webhook.');}
    }
    async function verifyProOnStartup() {
      if(!tg||!tg.initData||!workerIsConfigured())return;
      try{
        const data=await requestProStatus();
        const changed=state.proActive!==(data.active===true);
        state.proActive=data.active===true;
        proAccount={startedAt:data.startedAt||0,expiresAt:data.expiresAt||0,months:data.months||0,wasPro:data.wasPro===true||data.active===true,autoRenew:data.autoRenew,billingState:data.billingState||'ok'};
        if(!isProEnabled()&&['sunset','forest','midnight','rose','galaxy'].includes(state.selectedTheme))state.selectedTheme='aurora';
        if(changed){saveState();render();}else updateTopStats();
      }catch(error){console.warn('Lumi PRO status could not be refreshed:',error);}
    }

    function startLesson(lesson) {
      reviewSession = null;
      if (lesson.isPro && !isProEnabled()) { showToast('Эта миссия доступна в Lumi PRO ⭐'); return; }
      const isReplay = state.completedLessons.includes(lesson.id);
      refreshEnergy();
      // Completed lessons remain available for practice even when free energy is empty.
      // Replays improve mastery and history but never grant first-completion rewards again.
      if (!isProEnabled() && state.energy <= 0 && !isReplay) { showToast('Сердечки закончились. Дождись восстановления энергии или включи ДЕМО-PRO.'); return; }
      const allKnown = learnedWordIdsForLesson(lesson);
      const missingPrerequisites = isReplay ? [] : (lesson.requiresWords || []).filter(id => !knownWordSet().has(id));
      if (missingPrerequisites.length) { showToast(`Сначала изучи слова: ${missingPrerequisites.map(id => wordCatalog[id]?.en || id).join(', ')}`); return; }
      const tokensValid = lesson.sentenceTokens.every(([id]) => allKnown.includes(id));
      if (!tokensValid) { showToast('В этом задании есть ещё не изученные слова.'); return; }
      lessonSession = { lesson, stage:lesson.grammar?'grammar_intro':'cards', cardIndex:0, selectedTokens:[], builderChecked:false, builderCorrect:false, quizIndex:0, quizOrder:[...lesson.words], retryQueue:[], retrying:false, retryCount:0, quizSelected:null, quizChecked:false, grammarSelected:null, grammarChecked:false, correct:0, incorrect:0, rewarded:false };
      renderLesson(true);
    }
    function lessonProgress(session) {
      const grammarOffset = session.lesson.grammar ? 1 : 0;
      const grammarCheckCount = session.lesson.grammar ? 1 : 0;
      const base = session.lesson.words.length + 1 + session.lesson.words.length;
      const total = base + grammarOffset + grammarCheckCount;
      let complete = 0;
      if (session.stage === 'grammar_intro') complete = 0;
      else if (session.stage === 'cards') complete = grammarOffset + session.cardIndex;
      else if (session.stage === 'builder') complete = grammarOffset + session.lesson.words.length;
      else if (session.stage === 'quiz') complete = grammarOffset + session.lesson.words.length + 1 + session.quizIndex;
      else if (session.stage === 'grammar_check') complete = grammarOffset + base;
      else complete = total;
      return { total, complete, percent:total?complete/total*100:0 };
    }
    function lessonHeaderMarkup(session, progress) {
      return `<div class="lesson-header"><button class="icon-btn lesson-close" id="exitLesson" aria-label="Выйти из урока" title="Выйти">✕</button><div class="lesson-progress" role="progressbar" aria-label="Прогресс урока" aria-valuemin="0" aria-valuemax="${progress.total}" aria-valuenow="${progress.complete}"><span style="width:${progress.percent}%"></span></div><div class="lesson-count">${Math.min(progress.complete+1,progress.total)}/${progress.total}</div></div>`;
    }
    function renderLesson(resetScroll = false) {
      const session = lessonSession;
      if (!session) return;
      if (session.stage === 'result') { renderLessonResult(); return; }
      const screen = document.getElementById('screen');
      const progress = lessonProgress(session);
      const header = lessonHeaderMarkup(session,progress);
      const lesson = session.lesson;
      let content = '';
      if (session.stage === 'grammar_intro') {
        const grammar = lesson.grammar;
        content = `${header}<section class="card grammar-intro-card"><div class="eyebrow">УРОК ГРАММАТИКИ · ${escapeHtml(grammar.tense)}</div><h1 style="font-size:25px;margin:8px 0 12px">${escapeHtml(lesson.title)}</h1><div class="rule-example"><strong>Формула</strong><p style="margin:6px 0 0;font-weight:800">${escapeHtml(grammar.structure)}</p></div><p class="small muted" style="margin:12px 0">${escapeHtml(grammar.usage)}</p><div class="rule-example"><strong>Пример</strong><p style="margin:6px 0 0;font-weight:800">${escapeHtml(grammar.example)}</p><p class="small muted" style="margin:4px 0 0">${escapeHtml(grammar.exampleRu)}</p></div><p class="small muted" style="margin-top:12px">${escapeHtml(lesson.rule)}</p><button class="btn full" id="startGrammarPractice">Понял, начать практику →</button></section>`;
      } else if (session.stage === 'cards') {
        const word = wordCatalog[lesson.words[session.cardIndex]];

          <div class="lesson-stage-label"><span>Знакомство со словом</span><span>Карточка ${session.cardIndex+1} из ${lesson.words.length}</span></div>

            <div class="word-learning-emoji">${word.emoji}</div>
            <div class="eyebrow">${escapeHtml(lesson.planetName)}</div>
            <button class="lesson-prompt-word word-learning-en" data-word-tip="${word.id}">${escapeHtml(word.en)}</button>
            <div class="word-learning-ipa">${escapeHtml(word.ipa)}</div>
            <div class="word-learning-ru">${escapeHtml(word.ru)}</div>

          </div>`;
      } else if (session.stage === 'builder') {
        const tokens = lesson.sentenceTokens;

          const token=tokens[index]; return `<button class="word-bubble in-answer" data-token-idx="${index}" data-word-tip="${token[0]}" aria-label="Убрать слово ${escapeHtml(wordCatalog[token[0]].en)}">${escapeHtml(token[1])}</button>`;

        }).join('');
        content = `${header}
          <div class="lesson-stage-label"><span>Собери предложение</span><span>Слова уже изучены</span></div>
          <section class="card sentence-card">
            <div class="lesson-mascot-row">${lumiArt()}<div><div class="eyebrow">МИССИЯ ЛУМИ</div><strong>Поставь слова в правильном порядке</strong><div class="small muted">Все слова из карточек этого и прошлых уроков.</div></div></div>
            <div class="sentence-meaning">${escapeHtml(lesson.meaning)}</div>
            <div class="sentence-area-label">Твоё предложение</div><div class="sentence-answer" id="sentenceAnswer">${answerMarkup}</div>
            <div class="sentence-area-label">Словесные пузырьки · нажми, чтобы добавить</div><div class="sentence-bubbles" id="sentenceBubbles">${bubbles || '<span class="sentence-slot-hint">Все слова выбраны</span>'}</div>
            <div class="feedback ${session.builderChecked?'show '+(session.builderCorrect?'good':'bad'):''}" id="builderFeedback">${session.builderChecked ? (session.builderCorrect ? 'Отлично! Предложение собрано правильно ✨' : `Порядок пока не совпал. ${escapeHtml(lesson.rule)} Попробуй ещё раз — ты справишься!`) : ''}</div>
            <div class="lesson-actions"><button class="btn full" id="checkSentence" ${session.selectedTokens.length===tokens.length || session.builderChecked?'':'disabled'}>${session.builderChecked ? (session.builderCorrect ? 'К переводу →' : 'Собрать ещё раз') : 'Проверить предложение'}</button></div>
          </section>`;
      } else if (session.stage === 'grammar_check') {

      } else if (session.stage === 'quiz') {
        const wordId = (session.quizOrder || lesson.words)[session.quizIndex];
        const word = wordCatalog[wordId];
        const options = session.quizOptions.items;
        content = `${header}
          <div class="lesson-stage-label"><span>${session.retrying?'Повторяем сложное слово':'Выбери перевод'}</span><span>Слово ${session.quizIndex+1} из ${(session.quizOrder||lesson.words).length}</span></div>
          <section class="card lesson-card">
            <div class="lesson-mascot-row">${lumiArt()}<div><div class="eyebrow">ПРОВЕРКА ПАМЯТИ</div><strong>Как переводится слово?</strong><div class="small muted">Нажми на английское слово, чтобы увидеть подсказку и услышать его.</div></div></div>
            <div class="quiz-word-card"><div class="word-learning-emoji" style="width:58px;height:58px;font-size:31px;border-radius:19px">${word.emoji}</div><button class="lesson-prompt-word" data-word-tip="${word.id}" style="font-size:26px">${escapeHtml(word.en)}</button><span>${escapeHtml(word.ipa)}</span></div>
            <div class="answer-list">${options.map((option,index)=>`<button class="answer-option ${session.quizSelected===index?'selected':''} ${session.quizChecked && index===session.quizOptions.correctIndex?'correct':''} ${session.quizChecked && index===session.quizSelected && index!==session.quizOptions.correctIndex?'wrong':''}" data-quiz-option="${index}" ${session.quizChecked?'disabled':''}>${escapeHtml(option.ru)}</button>`).join('')}</div>
            <div class="feedback ${session.quizChecked?'show '+(session.quizSelected===session.quizOptions.correctIndex?'good':'bad'):''}" id="quizFeedback">${session.quizChecked ? (session.quizSelected===session.quizOptions.correctIndex ? 'Верно! Отличная память 🌟' : `Правильный перевод: ${escapeHtml(word.ru)}. ${escapeHtml(mistakeExplanation(wordId))}`) : ''}</div>

      screen.scrollTop = previousScroll;
      document.getElementById('exitLesson').addEventListener('click', () => { tap(); openExitModal('lesson'); });
      const startGrammarPractice=document.getElementById('startGrammarPractice');
      if(startGrammarPractice)startGrammarPractice.addEventListener('click',()=>{tap();session.stage='cards';renderLesson(true);});
      bindSpeechButtons(screen);
      bindWordTips(screen);

        const viewedWordId=lesson.words[session.cardIndex];

          const selectedAnswer=session.quizOptions.items[session.quizSelected]?.ru || '';
